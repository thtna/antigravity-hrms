# ==============================================================================
# ANTIGRAVITY HRMS — DOCKER COMPOSE (PRODUCTION STACK)
# ==============================================================================
# Services:
#   app       → Next.js HRMS application (port 3000)
#   db        → PostgreSQL 16 (internal network only in prod)
#   redis     → Redis 7 (internal network only in prod)
#   migrate   → One-shot migration job (runs before app starts)
#
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Primary Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: antigravity_hrms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-antigravity_hrms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Custom init scripts (e.g., extensions)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-antigravity_hrms}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hrms_network

  # ----------------------------------------------------------------------------
  # Redis 7 — Cache & Session Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: antigravity_hrms_redis
    restart: unless-stopped
    # Persist data with AOF + RDB snapshot
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - hrms_network

  # ----------------------------------------------------------------------------
  # Migrate — One-shot Prisma migration job
  # Runs prisma migrate deploy before app starts, then exits.
  # ----------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder   # Use builder stage (has prisma CLI + schema)
    container_name: antigravity_hrms_migrate
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-antigravity_hrms}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrms_network

  # ----------------------------------------------------------------------------
  # App — Next.js HRMS Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: antigravity_hrms_app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-antigravity_hrms}?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      # Persist uploaded avatars across container restarts
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hrms_network

# ------------------------------------------------------------------------------
# Named Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  hrms_network:
    driver: bridge
