# ==============================================================================
# ANTIGRAVITY HRMS — CI PIPELINE
# ==============================================================================
# Triggers: push to any branch, PR to main/develop
# Steps: install → typecheck → lint → test → build
# ==============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Node.js with npm cache
      # ------------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------------
      # 4. Generate Prisma Client (required for typecheck)
      # ------------------------------------------------------------------
      - name: Generate Prisma Client
        run: npx prisma generate

      # ------------------------------------------------------------------
      # 5. TypeScript — Zero errors required
      # ------------------------------------------------------------------
      - name: TypeScript check
        run: npx tsc --noEmit

      # ------------------------------------------------------------------
      # 6. ESLint — Zero errors required (warnings allowed)
      # ------------------------------------------------------------------
      - name: Lint
        run: npm run lint

      # ------------------------------------------------------------------
      # 7. Vitest — All test suites must pass
      # ------------------------------------------------------------------
      - name: Run tests
        run: npm test -- --run
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/antigravity_test?schema=public"
          AUTH_SECRET: "ci_test_secret_minimum_32_characters_long_value"
          AUTH_COOKIE_NAME: "antigravity_session"
          AUTH_TOKEN_EXPIRATION: "7d"
          DEFAULT_GEOFENCE_RADIUS_METERS: "100"
          LOG_LEVEL: "error"

      # ------------------------------------------------------------------
      # 8. Next.js production build — Must succeed with 79 routes
      # ------------------------------------------------------------------
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/antigravity_test?schema=public"
          AUTH_SECRET: "ci_test_secret_minimum_32_characters_long_value"
          AUTH_COOKIE_NAME: "antigravity_session"
          AUTH_TOKEN_EXPIRATION: "7d"
          DEFAULT_GEOFENCE_RADIUS_METERS: "100"
          NEXT_TELEMETRY_DISABLED: "1"

      # ------------------------------------------------------------------
      # 9. Validate Docker Compose syntax
      # ------------------------------------------------------------------
      - name: Validate docker-compose config
        run: docker compose config --quiet
