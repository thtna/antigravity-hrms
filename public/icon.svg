<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle grid accent pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Main Antigravity Emblem Shield -->
  <path d="M 256 90 L 370 145 C 370 270 256 360 256 395 C 256 360 142 270 142 145 Z"
        fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>
  <path d="M 256 105 L 355 155 C 355 260 256 345 256 375 C 256 345 157 260 157 155 Z"
        fill="none" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Stylized Modern 'A' / Peak symbol for Antigravity & Attendance -->
  <path d="M 256 160 L 325 305 L 285 305 L 256 240 L 227 305 L 187 305 Z"
        fill="url(#accentGrad)" />

  <!-- Center Pulse / Clock & Fingerprint Core -->
  <circle cx="256" cy="210" r="16" fill="#60a5fa" filter="url(#glow)"/>
  <path d="M 220 275 L 292 275" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Text Badge -->
  <text x="256" y="440" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="6">AGY HRMS</text>
</svg>
